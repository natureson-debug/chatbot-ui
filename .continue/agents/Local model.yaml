
name: Local llama.cpp Coding Assistant
version: 1.0.0
schema: v1

models:
  - name: Qwen3-Coder-30B-A3B
    provider: llama.cpp
    model: C:\AI\models\Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
    apiBase: http://127.0.0.1:8080
    apiKey: Hx6xv9Mt6xIbkq0eDE/jeSn7wmEMZeAPWshddeQGFAI=
    systemMessage: "You are a helpful coding assistant. When creating or editing files, use the tools provided to write files to the workspace."
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      contextLength: 32768
      maxTokens: 2048
      temperature: 0.2

context:
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: problems

experimental:
  tools:
    - name: write_file
      enabled: true
    - name: edit_file
      enabled: true
