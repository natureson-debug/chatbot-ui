<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="/favicon.png">

<title>Chatbot</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/style.css">
</head>

<body>
<script src="/theme-preference.js"></script>

<div id="crtFlicker" aria-hidden="true"></div>

<section id="loginScreen">
    <form id="loginForm">
        <h2>Sign in to Chatbot</h2>

        <label for="loginUsername">Username</label>
        <input
            id="loginUsername"
            type="text"
            autocomplete="username"
            required
        >

        <label for="loginPassword">Password</label>
        <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Sign In</button>
        <p id="loginError" role="alert" hidden></p>
    </form>
</section>

<div class="app">

    <header>
        <div class="header-title">
            <img src="/favicon.png" alt="Chatbot" class="header-icon">

            <div class="brand-block">
                <h1>CHATBOT</h1>
                <div class="status-line">
                    <span id="status">Connecting...</span>
                    <span id="terminalClock" aria-label="Current time">--:--:--</span>
                </div>
            </div>

            <label class="thinking-toggle">
                <input type="checkbox" id="thinking">
                <span>Thinking</span>
            </label>
        </div>

        <div class="controls">
            <div class="action-group">
                <button id="newChat" type="button">New Chat</button>
                <button id="logoutButton" type="button">Logout</button>
                <button id="adminConsoleButton" type="button" hidden>Console</button>
    
                <button id="deleteChat" type="button" hidden>Clear chat</button>
                <button id="settingsToggle" type="button" aria-expanded="false">Settings</button>
            </div>
        </div>
    </header>

    <div id="settingsPanel" class="settings-drawer" hidden>
    <section aria-label="Skills and tools" class="settings">
<label for="activeSkills">Active skills (select up to 3)</label><select id="activeSkills" multiple size="3" aria-label="Active skills"></select>
<label><input id="useTools" type="checkbox" disabled>Allow approved read-only tools for this request</label>
<p>Skill instructions, documents and search results cannot grant tool permissions. Images require a vision-capable connection.</p>
</section>
<div class="chat-model-picker"><label for="chatModelSelect">AI model</label><select id="chatModelSelect" aria-describedby="chatModelStatus"><option value="">Application default</option></select><small id="chatModelStatus" role="status">Existing conversation history is retained when switching models.</small></div>
<section class="settings">
        <label for="systemPrompt">System Prompt</label>

        <textarea
            id="systemPrompt"
            rows="3"
            placeholder="You are a helpful assistant."
        ></textarea>

        <div class="settings-row">
            <div class="setting-field">
                <label for="theme">Theme</label>
                <select id="theme">
                    <option value="normal-light">Light</option>
                    <option value="normal-dark">Dark</option>
                    <option value="dark">Phosphor</option>
                </select>
            </div>

            <div class="setting-field">
                <label for="temperature">Temperature</label>
                <input
                    type="number"
                    id="temperature"
                    min="0"
                    max="2"
                    step="0.1"
                    value="0.7"
                >
            </div>

            <div class="setting-field">
                <label for="maxTokens">Max Tokens</label>
                <input
                    type="number"
                    id="maxTokens"
                    min="1"
                    max="8192"
                    step="1"
                    value="4096"
                >
            </div>
        </div>
        <p id="userSettingsStatus" role="status" aria-live="polite" hidden></p>
    </section>
    </div>

    <div id="activeChatHeader" class="active-chat-header" aria-live="polite">
    <span id="activeChatTitle"></span>

    <button id="chatActionsToggle"
            type="button"
            aria-label="Chat actions"
            aria-haspopup="menu"
            aria-expanded="false">⋮</button>
</div>
    
    <div class="chat-shell">
        <aside id="chatList" aria-label="Chat list"></aside>
        <main id="chat"></main>
    </div>

    <div id="chatContextMenu" class="chat-context-menu" role="menu" hidden>
    <button id="renameChatAction" type="button" role="menuitem">
        Rename chat
    </button>

    <button id="clearChatAction" type="button" role="menuitem">
        Clear chat
    </button>

    <button id="deleteChatAction" type="button" role="menuitem">
        Delete chat
    </button>
</div>

    <footer>
        <div class="prompt-wrap">
            <span class="prompt-marker" aria-hidden="true">&gt;</span>
            <textarea
                id="prompt"
                placeholder="ENTER MESSAGE // SHIFT+ENTER FOR NEW LINE"
                rows="1"
            ></textarea>
        </div>

<label for="attachment" title="Attach text, PDF, DOCX, PNG or JPEG">📎 Attach</label>
<input
    id="attachment"
    type="file"
    accept=".txt,.pdf,.docx,.png,.jpg,.jpeg"
    hidden
>

<span id="attachmentName" hidden></span>

<button
    id="removeAttachment"
    type="button"
    aria-label="Remove selected attachment"
    title="Remove attachment"
    hidden
>✕</button>

        <button id="send">Send</button>

        
        <button id="stop" disabled>Stop</button>
    </footer>

</div>

<div id="terminalDialog" class="terminal-dialog" hidden>
    <div class="terminal-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="terminalDialogTitle">
        <div id="terminalDialogTitle" class="terminal-dialog-title"></div>
        <div id="terminalDialogMessage" class="terminal-dialog-message"></div>
        <input id="terminalDialogInput" type="text" autocomplete="off" hidden>
        <div id="terminalDialogButtons" class="terminal-dialog-buttons"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="/terminal.js"></script>
<script src="/extensions.js"></script>
<script src="/model-selector.js"></script>
<script src="/app.js"></script>

</body>
</html>
