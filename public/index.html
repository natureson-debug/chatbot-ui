<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="/favicon.png">

<title>Local AI Chatbot</title>

<link rel="stylesheet" href="/style.css">
</head>

<body>

<section id="loginScreen">
    <form id="loginForm">
        <h2>Local Chatbot</h2>
        <p>Sign in to continue</p>

        <label for="loginUsername">Username</label>
        <input
            id="loginUsername"
            type="text"
            autocomplete="username"
            required
        >

        <label for="loginPassword">Password</label>
        <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Sign in</button>
        <p id="loginError" role="alert" hidden></p>
    </form>
</section>

<div class="app">

    <header>
        <div class="header-title">
            <img src="/favicon.png" alt="Renitech AI" class="header-icon">

            <div class="brand-block">
                <h1>Chatbot</h1>
                <span id="status">Connecting...</span>
            </div>

            <label class="thinking-toggle">
                <input type="checkbox" id="thinking">
                <span>Thinking</span>
            </label>
        </div>

        <div class="controls">
            <div class="action-group">
                <button id="newChat" type="button">New Chat</button>
                <button id="logoutButton" type="button">Logout</button>
                <button id="adminConsoleButton" type="button" hidden>Console</button>
    
                <button id="deleteChat" type="button" hidden>Clear chat</button>
                <button id="settingsToggle" type="button" aria-expanded="false">Settings</button>
            </div>
        </div>
    </header>

    <section id="settingsPanel" class="settings" hidden>
        <label for="systemPrompt">System Prompt</label>

        <textarea
            id="systemPrompt"
            rows="3"
            placeholder="You are a helpful assistant."
        ></textarea>

        <div class="settings-row">
            <div class="setting-field">
                <label for="temperature">Temperature</label>
                <input
                    type="number"
                    id="temperature"
                    min="0"
                    max="2"
                    step="0.1"
                    value="0.7"
                >
            </div>

            <div class="setting-field">
                <label for="maxTokens">Max Tokens</label>
                <input
                    type="number"
                    id="maxTokens"
                    min="1"
                    max="49152"
                    step="1"
                    value="4096"
                >
            </div>
        </div>
    </section>

    <div id="activeChatHeader" class="active-chat-header" aria-live="polite">
    <span id="activeChatTitle"></span>

    <button id="chatActionsToggle"
            type="button"
            aria-label="Chat actions"
            aria-haspopup="menu"
            aria-expanded="false">⋮</button>
</div>
    
    <div class="chat-shell">
        <aside id="chatList" aria-label="Chat list"></aside>
        <main id="chat"></main>
    </div>

    <div id="chatContextMenu" class="chat-context-menu" role="menu" hidden>
    <button id="renameChatAction" type="button" role="menuitem">
        Rename chat
    </button>

    <button id="clearChatAction" type="button" role="menuitem">
        Clear chat
    </button>

    <button id="deleteChatAction" type="button" role="menuitem">
        Delete chat
    </button>
</div>

    <footer>
        <textarea
            id="prompt"
            placeholder="Message"
            rows="1"
        ></textarea>

<label for="attachment" title="Attach a text file">📎 Attach</label>
<input
    id="attachment"
    type="file"
    accept=".txt,text/plain"
    hidden
>

<span id="attachmentName" hidden></span>

<button
    id="removeAttachment"
    type="button"
    aria-label="Remove selected attachment"
    title="Remove attachment"
    hidden
>✕</button>

        <button id="send">Send</button>

        
        <button id="stop" disabled>Stop</button>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="/app.js"></script>

</body>
</html>
